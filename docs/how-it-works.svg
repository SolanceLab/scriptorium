<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 872" width="1020" height="872" role="img" aria-labelledby="t d">
  <title id="t">How Scriptorium writes entries and chat notes</title>
  <desc id="d">At the top, entries your AI chooses to write in named collections, with revision history, pins, and recoverable deletes. Two entries are shown, a pinned entry about Mira moving to Lisbon and a lesson. Below, its assistant: your chats go in on the left, a model you choose drafts from them, plain code checks every quote against its line, and out come a note in the speaker's exact words with its line and date, a page for each person with only what they said themselves, and a tray of what it could not prove, set aside for you to check. At the bottom, its pair Antechamber finds your notes and chat lines again: asked where Mira lives now, it returns the one right note with its line and date.</desc>
  <style>
    .frame{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5;stroke-dasharray:6 5}
    .title{font:600 17px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .label{font:500 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .small{font:400 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#59636e}
    .quote{font:italic 400 12px Georgia,'Times New Roman',serif;fill:#1f2328}
    .verb{font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328}
    .arrow{stroke:#59636e;stroke-width:2;fill:none}
    .head{fill:#59636e}
    .line{stroke:#afb8c1;stroke-width:3;stroke-linecap:round}
    .note{fill:#dafbe1;stroke:#1a7f37}
    .chat{fill:#ddf4ff;stroke:#0969da}
    .mem{fill:#fbefff;stroke:#8250df}
    .vault{fill:#fff1e5;stroke:#bc4c00}
    .old{stroke:#afb8c1;stroke-width:2;stroke-dasharray:5 5;fill:none}.oldhead{fill:#afb8c1}.x{stroke:#cf222e}
    .chat.pick{fill:#0969da}
    .ante{fill:#1f2328;stroke:#1f2328}
    .antetext{font:600 14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#ffffff}
    .antesmall{font:400 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#d0d7de}
    .card{fill:#ffffff;stroke:#8c959f}
    @media (prefers-color-scheme: dark){
      .frame{fill:#161b22;stroke:#6e7681}
      .title,.label,.verb,.quote{fill:#e6edf3}
      .small{fill:#9198a1}
      .arrow{stroke:#9198a1}.head{fill:#9198a1}
      .line{stroke:#484f58}
      .note{fill:#0f2a17;stroke:#3fb950}
      .chat{fill:#0c2440;stroke:#4493f8}
      .mem{fill:#2a1640;stroke:#ab7df8}
      .vault{fill:#3a1d0a;stroke:#f0883e}
      .old{stroke:#484f58}.oldhead{fill:#484f58}.x{stroke:#f85149}
      .chat.pick{fill:#4493f8}
      .ante{fill:#e6edf3;stroke:#e6edf3}
      .antetext{fill:#0d1117}
      .antesmall{fill:#424a53}
      .card{fill:#0d1117;stroke:#6e7681}
    }
  </style>


  <!-- TOP: entries -->
  <rect class="frame" x="20" y="20" width="980" height="190" rx="14"/>
  <text class="title" x="40" y="52">Your AI's entries</text>
  <text class="small" x="40" y="70">written by your AI</text>
  <text class="small" x="40" y="104">collections it names</text>
  <text class="small" x="40" y="120">every version kept</text>
  <text class="small" x="40" y="136">pins what it wants close</text>
  <text class="small" x="40" y="152">a delete sets aside, never erases</text>
  <text class="small" x="40" y="168">no script writes into it:</text>
  <text class="small" x="40" y="184">only your AI writes entries</text>

  <rect class="card" x="270" y="90" width="350" height="100" rx="8"/>
  <rect class="note" x="270" y="90" width="8" height="100" rx="3" stroke-width="1.2"/>
  <text class="label" x="290" y="110">Entry · 3 Nov · pinned</text>
  <text class="quote" x="290" y="134">Mira told us she moved to Lisbon. I want</text>
  <text class="quote" x="290" y="152">to remember how happy she sounded.</text>
  <text class="small" x="290" y="176">version 2 · version 1 kept</text>

  <rect class="card" x="640" y="90" width="340" height="100" rx="8"/>
  <rect class="note" x="640" y="90" width="8" height="100" rx="3" stroke-width="1.2"/>
  <text class="label" x="660" y="110">Lessons</text>
  <text class="quote" x="660" y="134">Ask before I assume a plan</text>
  <text class="quote" x="660" y="152">has changed.</text>
  <text class="small" x="660" y="176">its own words, found again later</text>

  <text class="verb" x="510" y="244" text-anchor="middle">and an assistant at its elbow, so nothing that matters slips</text>

<g transform="translate(0,262)">
  <!-- TOP: the old way, crossed out -->
  <path class="old" d="M 200 58 C 400 10, 620 10, 820 58"/>
  <path class="oldhead" d="M 820 58 l -12 -2 l 7 -9 z"/>
  <line class="x" x1="498" y1="14" x2="522" y2="38" stroke-width="3"/>
  <line class="x" x1="522" y1="14" x2="498" y2="38" stroke-width="3"/>
  <text class="small" x="510" y="56" text-anchor="middle">Without it: you search thousands of lines yourself</text>

<g transform="translate(0,90)">
  <!-- LEFT: your chats -->
  <rect class="frame" x="20" y="20" width="330" height="340" rx="14"/>
  <text class="title" x="40" y="52">Your chats</text>
  <text class="small" x="40" y="70">thousands of lines, said once and in passing</text>
  <g stroke-width="1.2">
    <rect class="chat" x="40" y="88" width="210" height="22" rx="11"/>
    <rect class="chat" x="110" y="118" width="220" height="22" rx="11"/>
    <rect class="chat pick" x="40" y="148" width="240" height="22" rx="11"/>
    <text class="label" x="54" y="163" fill="#ffffff" style="fill:#ffffff">Mira: we moved to Lisbon in May!</text>
    <rect class="chat" x="130" y="178" width="200" height="22" rx="11"/>
    <rect class="chat" x="40" y="208" width="180" height="22" rx="11"/>
    <rect class="chat" x="90" y="238" width="240" height="22" rx="11"/>
    <rect class="chat" x="40" y="268" width="220" height="22" rx="11"/>
    <rect class="chat" x="150" y="298" width="180" height="22" rx="11"/>
  </g>
  <text class="small" x="40" y="342">…and the next day, and the next</text>

  <!-- arrow in -->
  <path class="arrow" d="M 352 190 L 402 190"/>
  <path class="head" d="M 410 190 l -11 -6 l 0 12 z"/>

  <!-- CENTRE: Scriptorium -->
  <rect class="ante" x="412" y="130" width="196" height="120" rx="12"/>
  <text class="antetext" x="510" y="172" text-anchor="middle">The assistant</text>
  <text class="antesmall" x="510" y="196" text-anchor="middle">a model you choose drafts</text>
  <text class="antesmall" x="510" y="214" text-anchor="middle">then the code checks every</text>
  <text class="antesmall" x="510" y="232" text-anchor="middle">quote against its line</text>

  <!-- arrows out -->
  <path class="arrow" d="M 610 160 C 630 160, 630 96, 650 96"/>
  <path class="head" d="M 658 96 l -11 -6 l 0 12 z"/>
  <path class="arrow" d="M 610 190 L 650 190"/>
  <path class="head" d="M 658 190 l -11 -6 l 0 12 z"/>
  <path class="arrow" d="M 610 220 C 630 220, 630 296, 650 296"/>
  <path class="head" d="M 658 296 l -11 -6 l 0 12 z"/>

  <!-- RIGHT: what it writes -->
  <rect class="frame" x="660" y="20" width="340" height="340" rx="14"/>
  <text class="title" x="680" y="52">Notes it writes</text>

  <!-- a note -->
  <rect class="card" x="680" y="66" width="300" height="74" rx="8"/>
  <rect class="mem" x="680" y="66" width="8" height="74" rx="3" stroke-width="1.2"/>
  <text class="label" x="700" y="86">A note</text>
  <text class="quote" x="700" y="106">“we moved to Lisbon in May!”</text>
  <text class="small" x="700" y="126">Mira · line 214 · said on 3 Nov</text>

  <!-- a person's page -->
  <rect class="card" x="680" y="152" width="300" height="84" rx="8"/>
  <rect class="note" x="680" y="152" width="8" height="84" rx="3" stroke-width="1.2"/>
  <text class="label" x="700" y="172">Mira's page</text>
  <line class="line" x1="700" y1="186" x2="712" y2="186"/>
  <text class="small" x="720" y="190">lives in Lisbon, since May  “we moved…”</text>
  <line class="line" x1="700" y1="204" x2="712" y2="204"/>
  <text class="small" x="720" y="208">works as a nurse  “my shift at the…”</text>
  <text class="small" x="700" y="228">only what Mira said herself</text>

  <!-- set aside -->
  <rect class="card" x="680" y="248" width="300" height="90" rx="8"/>
  <rect class="vault" x="680" y="248" width="8" height="90" rx="3" stroke-width="1.2"/>
  <text class="label" x="700" y="268">Set aside for you to check</text>
  <text class="small" x="700" y="288">“Mira has red hair”</text>
  <text class="small" x="700" y="304">no line says so: kept out, with the reason</text>
  <text class="small" x="700" y="326">nothing is kept quietly</text>

  <!-- BOTTOM: with its pair, Antechamber -->
  <rect class="frame" x="20" y="384" width="980" height="126" rx="14"/>
  <a href="https://github.com/SolanceLab/antechamber">
    <text class="title" x="40" y="414">Find notes with Antechamber</text>
  </a>
  <text class="small" x="40" y="434">your notes and people cards</text>
  <text class="small" x="40" y="450">become something your AI</text>
  <text class="small" x="40" y="466">can find again, in one ask</text>

  <path class="arrow" d="M 830 362 L 830 400"/>
  <path class="head" d="M 830 408 l -6 -11 l 12 0 z"/>
  <rect class="ante" x="730" y="410" width="200" height="72" rx="12"/>
  <a href="https://github.com/SolanceLab/antechamber">
    <text class="antetext" x="830" y="440" text-anchor="middle">Antechamber</text>
  </a>
  <text class="antesmall" x="830" y="462" text-anchor="middle">finds it again</text>

  <path class="arrow" d="M 728 446 L 640 446"/>
  <path class="head" d="M 632 446 l 11 -6 l 0 12 z"/>

  <rect class="card" x="270" y="402" width="356" height="92" rx="8"/>
  <rect class="mem" x="270" y="402" width="8" height="92" rx="3" stroke-width="1.2"/>
  <text class="label" x="290" y="424">Your AI asks: where does Mira live now?</text>
  <text class="quote" x="290" y="448">“we moved to Lisbon in May!”</text>
  <text class="small" x="290" y="468">the one right note · Mira · line 214 · 3 Nov</text>
  <text class="small" x="290" y="484">no digging through old chats, no guessing</text>
</g>
</g>
</svg>
